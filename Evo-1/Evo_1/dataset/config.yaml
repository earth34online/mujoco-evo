max_action_dim: 24
max_state_dim: 24
max_views: 3
active_action_mask: [1, 1, 1, 0, 0, 0, 1]
# The fixed MuJoCo camera is metrically tied to Cartesian action labels.
# Cropping or rotating an image without transforming dx/dy/dz corrupts that
# correspondence.  Keep photometric augmentation but preserve pixel geometry.
preserve_spatial_calibration: true

data_groups:
  mujoco_pickplace:
    MuJoCo_PickPlace_Dataset:
      path: /home/user/mujoco+evo/Mujoco_training_dataset/cache/mujoco_pickplace
      view_map:
        image_1: observation.images.front
